version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12  # Adjust to the Python version you're using
    commands:
      - echo Installing dependencies...
      - pip install -r requirements.txt  # Installs any dependencies specified in requirements.txt

  pre_build:
    commands:
      - echo Running tests...  # Optional, you can add test commands here if you have any

  build:
    commands:
      - echo Build completed successfully!

artifacts:
  files:
    - '**/*'  # Include all files from your repository (or adjust if you want a subset)
  base-directory: '.'  # The base directory is the root of your project
